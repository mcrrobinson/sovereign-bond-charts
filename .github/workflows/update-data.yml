name: Update data

on:
  schedule:
    # OECD and BIS publish the previous month's figures mid-month; refresh weekly to pick them up.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data from OECD, BIS and IMF
        run: python scripts/fetch_data.py
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data/data.json; then
            echo "No new figures."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git commit -m "Update data $(date -u +%Y-%m-%d)"
          git push
